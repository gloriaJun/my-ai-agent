name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'automations/**'

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/my-ai-agent

            BEFORE=$(git rev-parse HEAD)
            git pull --rebase origin main

            # OpenClaw 관련 파일 변경 감지
            CHANGED=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || echo "")
            CONFIG_CHANGED=0; PROMPTS_CHANGED=0
            echo "$CHANGED" | grep -q "^config/openclaw/" && CONFIG_CHANGED=1 || true
            echo "$CHANGED" | grep -q "^prompts/openclaw/" && PROMPTS_CHANGED=1 || true

            if [ $((CONFIG_CHANGED + PROMPTS_CHANGED)) -gt 0 ]; then
              echo "OpenClaw 관련 파일 변경 감지 (config=$CONFIG_CHANGED, prompts=$PROMPTS_CHANGED)"
              docker compose stop openclaw
            fi

            sudo bash scripts/render-openclaw-config.sh

            if [ "$PROMPTS_CHANGED" -eq 1 ]; then
              echo "prompts 변경 감지 → 세션 초기화"
              bash scripts/ctl.sh reset-session
            fi

            sudo chown -R 1000:1000 data/

            docker compose up -d --build

            # 컨테이너 기동 대기
            sleep 10

            # 기동 실패한 서비스 검출
            FAILED=""
            for svc in n8n openclaw; do
              if ! docker ps --filter "name=^${svc}$" --filter "status=running" -q | grep -q .; then
                FAILED="${FAILED} ${svc}"
              fi
            done

            if [ -n "$FAILED" ]; then
              echo "Failed services:$FAILED"
              for svc in $FAILED; do
                echo "--- $svc logs ---"
                docker logs "$svc" --tail=30
              done
              exit 1
            fi

            echo "All services running."
