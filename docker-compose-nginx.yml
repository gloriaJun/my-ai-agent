name: nginx-infra

services:
  nginx-proxy:
    image: "jc21/nginx-proxy-manager:latest"
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80" # 외부 HTTP 접속
      - "443:443" # 외부 HTTPS 접속
      - "81:81" # NPM 관리자 페이지
    environment:
      - TZ=Asia/Seoul
    volumes:
      - ./data/nginx/config:/data
      - ./data/nginx/letsencrypt:/etc/letsencrypt
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # openclaw 의 gateway.trustedProxies 가 이 주소를 신뢰한다.
    # 동적 할당(.2부터 순차)과 겹치지 않도록 높은 주소를 고정한다.
    networks:
      default:
        ipv4_address: 172.18.0.250
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:81"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  default:
    external: true
    name: proxy-net
