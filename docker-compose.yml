  n8n:
    build:
      context: .
      dockerfile: docker/n8n.Dockerfile
    image: n8n-custom
    container_name: n8n
    user: "1000:1000"
    group_add:
      - "988"
    # ports:
    # - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
      N8N_LOG_LEVEL: info
      WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_TRUST_PROXY: true
      N8N_PROXY_HOPS: 1
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - ./data/n8n:/home/node/.n8n
      - /var/run/docker.sock:/var/run/docker.sock
      # - ~/Documents/GitHubPrivate:/workspace
      # - ~/Documents/GitHubPrivate/my-ai-agent:/workspace/my-ai-agent:ro
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    restart: unless-stopped
    # depends_on:
    #   - ollama

  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: openclaw
    user: "1000:1000"
    # ports:
    #   - "18789:18789"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      TZ: Asia/Seoul
    volumes:
      - ./data/openclaw:/home/node/.openclaw
      - ./.env:/home/node/.openclaw/.env:ro
      - ./prompts/openclaw/SOUL.md:/home/node/.openclaw/workspace/SOUL.md:ro
      - ./prompts/openclaw/skills:/home/node/.openclaw/workspace/skills:ro
      # - ~/Documents/GitHubPrivate:/workspace
      # - ~/Documents/GitHubPrivate/my-ai-agent:/workspace/my-ai-agent:ro
    command: ["openclaw", "gateway", "run"]
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    # depends_on:
    #   - ollama

networks:
  default:
    external: true
    name: proxy-net
